<style>

const G={flap:{n:'orbit flap',c:'reflex',d:'a circle, a gap, a tap.',f:flap},snake:{n:'snake',c:'reflex',d:'the classic, softened.',f:snake},num:{n:'number guesser',c:'brain',d:'hot, cold, higher, lower.',f:num},word:{n:'word guesser',c:'brain',d:'five letters, six tries. daily word.',f:word},breathe:{n:'breathe',c:'zen',d:'slow in, slower out.',f:breathe},memory:{n:'memory match',c:'brain',d:'eight pairs, few moves.',f:memory},react:{n:'reaction time',c:'reflex',d:'wait for the colour. tap.',f:react},hang:{n:'hangman',c:'brain',d:'line art, six lives.',f:hang},g2048:{n:'2048',c:'puzzle',d:'slide, merge, repeat.',f:g2048},breakout:{n:'breakout',c:'reflex',d:'bricks, a paddle, a glow.',f:breakout},lights:{n:'lights out',c:'puzzle',d:'switch every light off.',f:lights},simon:{n:'simon',c:'brain',d:'watch, then repeat.',f:simon},ttt:{n:'tic-tac-toe',c:'puzzle',d:'beat the quiet opponent.',f:ttt}};
/* game shell */
let gid,end;const bst=()=>$('#bs').textContent=S.hs[gid]??'–';
const stt=k=>S.st[k]=S.st[k]||{s:0,r:0,w:0,t:0};let t_;
const A={set(n){$('#sc').textContent=n},fin(n,lo,win){const b=S.hs[gid],q=stt(gid);q.r++;if(win)q.w++;if(n!=null&&(b==null||(lo?n<b:n>b)))S.hs[gid]=n;save();bst()}};
function open(id){close();gid=id;t_=Date.now();stt(id).s++;$('#gn').textContent=G[id].n;$('#sc').textContent=0;bst();$('#st').innerHTML='';$('#game').classList.add('on');document.body.classList.add('ing');end=G[id].f($('#st'),A);snd(440,.1)}
function close(){if(!gid)return;end&&end();end=0;const sec=Math.round((Date.now()-t_)/1e3),dk=new Date().toISOString().slice(0,10);stt(gid).t+=sec;S.days[dk]=(S.days[dk]||0)+sec;save();gid=0;$('#game').classList.remove('on');document.body.classList.remove('ing')}
$('#back').onclick=close;
/* home */
$('#grid').innerHTML=Object.entries(G).map(([k,g],i)=>`<button class="card" data-g="${k}" data-c="${g.c}" style="--i:${i+4}"><span class="pv"><i></i><i></i><i></i><i></i></span><b>${g.n}</b><small>${g.d}</small></button>`).join('');
$('#grid').onclick=e=>{const c=e.target.closest('.card');c&&open(c.dataset.g)};
$('#grid').onpointermove=e=>{const c=e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}};
$('#flt').innerHTML=['all','reflex','brain','puzzle','zen'].map((f,i)=>`<button class="${i?'':'on'}" data-f="${f}">${f}</button>`).join('');
$('#flt').onclick=e=>{const f=e.target.dataset.f;if(!f)return;document.querySelectorAll('#flt button').forEach(b=>b.classList.toggle('on',b==e.target));document.querySelectorAll('.card').forEach(c=>c.style.display=f=='all'||c.dataset.c==f?'':'none')};
const surprise=()=>{const k=Object.keys(G);open(k[R()*k.length|0])};$('#sur').onclick=surprise;
/* settings */
let son=0,wl=0,pon=0;
const CT=[['sel','card','cards',['glass','flat','outline']],['sel','font','typeface',['sans','serif','mono']],['rng','spd','drift speed',0,3,.1],['rng','gn','grain',0,.35,.01],['chk','pt','floating dust'],['chk','cr','soft cursor'],['chk','h24','24-hour clock'],['chk','snd','sound']];
function build(){$('#set').innerHTML=`<h3>settings <button class="btn" id="sx">close</button></h3><p class="mu">theme</p><div id="ths">${[...Object.keys(T),'auto'].map(k=>`<button data-th="${k}" title="${k}" style="background:${k=='auto'?'conic-gradient(#3b2a8f,#f7b6c8,#e8dcc4,#c2674f,#3b2a8f)':`linear-gradient(135deg,${T[k].b.join(',')})`}"></button>`).join('')}</div>
 <label>accent <span><input type="color" id="acc"> <button class="btn" id="acr">reset</button></span></label>`+CT.map(([t,k,l,a,b,s])=>`<label>${l}${t=='sel'?`<select data-k="${k}">${a.map(o=>`<option ${S[k]==o?'selected':''}>${o}</option>`).join('')}</select>`:t=='rng'?`<input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${S[k]}">`:`<input type="checkbox" data-k="${k}" ${S[k]?'checked':''}>`}</label>`).join('')+`<button class="btn" id="rst">reset everything</button>`;apply()}
$('#set').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(t.id=='acc')set({ac:t.value});else if(k)set({[k]:t.type=='checkbox'?+t.checked:t.type=='range'?+t.value:t.value})});
$('#set').addEventListener('click',e=>{const t=e.target;if(t.dataset.th)set({th:t.dataset.th});else if(t.id=='sx')panel(0);else if(t.id=='acr'){set({ac:''})}else if(t.id=='rst'){S={...DEF,hs:{},st:{},days:{}};save();build();acc();tick()}});
const panel=o=>{son=o;$('#set').classList.toggle('on',!!o)},wall=o=>{wl=o;document.body.classList.toggle('wall',!!o)};
/* palette */
let sel=0,list=[];
const cmds=()=>[...Object.keys(G).map(k=>['play '+G[k].n,()=>open(k)]),...[...Object.keys(T),'auto'].map(k=>['theme '+k,()=>set({th:k})]),['account',()=>prof(1)],['settings',()=>panel(1)],['wallpaper mode',()=>wall(1)],['toggle sound',()=>set({snd:+!S.snd})],['surprise me',surprise],['home',close]];
function pal(o){pon=o;$('#pal').classList.toggle('on',!!o);if(o){$('#pq').value='';rp();$('#pq').focus()}}
function rp(){const q=$('#pq').value.toLowerCase();list=cmds().filter(c=>c[0].includes(q));sel=0;pl()}
const pl=()=>$('#pl').innerHTML=list.map((c,i)=>`<li class="${i==sel?'a':''}" data-i="${i}">${c[0]}</li>`).join('');
$('#pq').oninput=rp;
$('#pq').onkeydown=e=>{if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();sel=(sel+(e.key=='ArrowDown'?1:-1)+(list.length||1))%(list.length||1);pl()}else if(e.key=='Enter'&&list[sel]){const f=list[sel][1];pal(0);f()}};
$('#pl').onclick=e=>{const i=e.target.dataset.i;if(i!=null){const f=list[i][1];pal(0);f()}};$('#pal').onclick=e=>{if(e.target.id=='pal')pal(0)};
$('#dock').onclick=e=>{const a=e.target.dataset.a;if(a=='home')$('#home').scrollTo({top:0,behavior:'smooth'});if(a=='games')$('#grid').scrollIntoView({behavior:'smooth'});if(a=='set')panel(!son);if(a=='pal')pal(1)};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();pal(!pon);return}
 if(e.key=='Escape'){if(pon)pal(0);else if($('#acct').classList.contains('on'))prof(0);else if(son)panel(0);else if(wl)wall(0);else close();return}
 if(pon||gid||/INPUT|SELECT/.test(e.target.tagName))return;if(e.key=='p')wall(!wl)});
/* account */
const COLS=['#8b7bff','#ff8a7a','#6ff2c0','#ffb347','#e0567c','#4aa3ff'],fm=s=>s>=3600?(s/3600).toFixed(1)+'h':Math.round(s/60)+'m';let pc=COLS[0];
function acc(){const u=S.u;$('#me').innerHTML=u?`<span class='av' style='background:${u.c}'>${u.n[0]}</span>${u.n}`:`<span class='av' style='background:var(--gl);color:var(--tx)'>+</span>create account`}
const signup=()=>`<h3 style='font-weight:300;font-size:22px'>create your account</h3><p class='mu'>just a name and a colour. no email, no password. it stays in this browser and tracks your progress.</p><input type='text' id='un' maxlength='16' placeholder='your name' autocomplete='off'><div class='sw' id='sw'>${COLS.map(c=>`<button data-c='${c}' style='background:${c}' class='${c==pc?'on':''}'></button>`).join('')}</div><div class='row'><button class='btn on' id='mk'>create account</button><button class='btn' id='cl'>cancel</button></div>`;
function profile(){const u=S.u,v=Object.values(S.st),tot=k=>v.reduce((a,q)=>a+q[k],0),days=[];
 for(let i=83;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10),m=(S.days[d]||0)/60;days.push(`<u title='${d}' style='opacity:${m?Math.min(.3+m/20,1):.08}'></u>`)}
 const mx=Math.max(1,...v.map(q=>q.t));let sk=0;for(let i=0;i<400;i++){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);if(S.days[d])sk++;else if(i)break}
 return `<div style='display:flex;gap:14px;align-items:center'><span class='av' style='background:${u.c};width:52px;height:52px;font-size:22px'>${u.n[0]}</span><div><h3 style='font-weight:300;font-size:24px'>${u.n}</h3><p class='mu mono' style='font-size:12px'>member since ${u.s}</p></div></div>
<div class='kp'><div><b>${fm(tot('t'))}</b><small>time played</small></div><div><b>${tot('s')}</b><small>sessions</small></div><div><b>${tot('r')}</b><small>rounds</small></div><div><b>${tot('w')}</b><small>wins</small></div><div><b>${sk}d</b><small>day streak</small></div></div>
<div class='gr'>${Object.entries(G).map(([k,g])=>{const q=S.st[k]||{s:0,r:0,w:0,t:0};return`<div><span>${g.n}<br><small class='mu mono'>${fm(q.t)} · ${q.w} wins / ${q.r} rounds · best ${S.hs[k]??'–'}</small></span><i><s style='width:${q.t/mx*100}%'></s></i></div>`}).join('')}</div>
<p class='mu' style='font-size:12px'>activity, last 12 weeks</p><div class='hm'>${days.join('')}</div>
<div class='row'><button class='btn' id='cl'>close</button><button class='btn' id='out'>delete account</button></div>`}
function prof(o){$('#acct').classList.toggle('on',!!o);if(o){$('#ab').innerHTML=S.u?profile():signup();$('#ab').scrollTop=0}}
$('#me').onclick=()=>prof(1);$('#acct').onclick=e=>{if(e.target.id=='acct')prof(0)};
$('#ab').onclick=e=>{const t=e.target;if(t.dataset.c){pc=t.dataset.c;document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b==t))}else if(t.id=='cl')prof(0);
 else if(t.id=='mk'){const n=$('#un').value.replace(/[<>&"']/g,'').trim();if(!n)return;S.u={n,c:pc,s:new Date().toLocaleDateString(undefined,{month:'short',year:'numeric'})};save();acc();tick();prof(1)}
 else if(t.id=='out'&&confirm('delete your account and all progress?')){S.u=null;S.st={};S.hs={};S.days={};save();acc();tick();prof(0)}};
build();acc();tick();setInterval(tick,1000);setInterval(()=>S.th=='auto'&&apply(),6e5);requestAnimationFrame(bgf);
</script></body></html>
